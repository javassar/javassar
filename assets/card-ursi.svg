<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="cardGrid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="230" rx="14" fill="url(#cardBg2)"/>
  <rect width="1200" height="230" rx="14" fill="url(#cardGrid2)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="228.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0" y="0" width="4" height="230" rx="2" fill="#818cf8"/>

  <g transform="translate(36, 32)">
    <text class="mono" font-size="11" fill="#818cf8" letter-spacing="1.5" font-weight="600">PROJECT // 02 · RESEARCH FELLOWSHIP (URSI)</text>
    <text y="32" class="sans" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">URSI Conversation Bot: Multi-Agent AI</text>
    <text y="58" class="sans" font-size="14" fill="#94a3b8">
      Engineering multi-agent conversational systems to measure and reduce reluctance on controversial topics.
    </text>

    <!-- Architecture Schematic -->
    <g transform="translate(0, 84)">
      <rect width="150" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" class="mono" font-size="11" fill="#818cf8">MULTI-AGENT LLM</text>
      <line x1="150" y1="17" x2="180" y2="17" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>

      <g transform="translate(180, 0)">
        <rect width="160" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="mono" font-size="11" fill="#38bdf8">JSPSYCH PLATFORM</text>
      </g>
      <line x1="340" y1="17" x2="370" y2="17" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>

      <g transform="translate(370, 0)">
        <rect width="160" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="mono" font-size="11" fill="#34d399">FACTOR ANALYSIS</text>
      </g>
      <line x1="530" y1="17" x2="560" y2="17" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>

      <g transform="translate(560, 0)">
        <rect width="150" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="mono" font-size="11" fill="#f43f5e">NLP SENTIMENT</text>
      </g>
    </g>

    <!-- Tech Tag Chips -->
    <g transform="translate(0, 142)">
      <text class="mono" font-size="11" fill="#64748b">STACK:</text>
      <rect x="56" y="-14" width="76" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="70" y="3" class="mono" font-size="11.5" fill="#cbd5e1">Python</text>

      <rect x="140" y="-14" width="86" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="154" y="3" class="mono" font-size="11.5" fill="#cbd5e1">jsPsych</text>

      <rect x="234" y="-14" width="144" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="248" y="3" class="mono" font-size="11.5" fill="#cbd5e1">Multi-Agent LLMs</text>

      <rect x="386" y="-14" width="136" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="400" y="3" class="mono" font-size="11.5" fill="#818cf8">Factor Analysis</text>
    </g>
  </g>

  <!-- Right Side Outcomes Pod -->
  <g transform="translate(800, 26)">
    <rect width="364" height="176" rx="10" fill="#070d18" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="28" class="mono" font-size="11" fill="#64748b" letter-spacing="1.5">EMPIRICAL OUTCOMES</text>
    <line x1="22" y1="38" x2="342" y2="38" stroke="#1e293b" stroke-width="1"/>

    <text x="22" y="74" class="sans" font-size="24" font-weight="800" fill="#818cf8">N &gt; 550</text>
    <text x="150" y="72" class="sans" font-size="13.5" fill="#e2e8f0" font-weight="500">Online Psychometric Sample</text>

    <!-- Sparkline -->
    <g transform="translate(22, 100)">
      <path d="M 0 30 Q 50 18, 100 22 T 180 8 T 240 14 T 310 4 L 310 38 L 0 38 Z" fill="url(#curveGrad)"/>
      <path d="M 0 30 Q 50 18, 100 22 T 180 8 T 240 14 T 310 4" fill="none" stroke="#818cf8" stroke-width="2"/>
    </g>
    <text x="22" y="156" class="mono" font-size="11.5" fill="#38bdf8">RELUCTANCE DE-ESCALATION METRIC</text>
  </g>
</svg>
