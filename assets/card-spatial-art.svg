<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBgArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <pattern id="cardGridArt" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="230" rx="14" fill="url(#cardBgArt)"/>
  <rect width="1200" height="230" rx="14" fill="url(#cardGridArt)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="228.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0" y="0" width="4" height="230" rx="2" fill="url(#roseAccent)"/>

  <!-- Left Column -->
  <g transform="translate(36, 30)">
    <text class="mono" font-size="11" fill="#fb7185" letter-spacing="1.5" font-weight="600">STUDIO // SPATIAL ARCHITECTURE &amp; FINE ART</text>
    <text y="30" class="sans" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Physical Prototyping, Negative Space &amp; Craft</text>
    <text y="54" class="sans" font-size="14" fill="#94a3b8">
      Spatial design, physical prototyping, and intentional craft bridging tactile art with technology.
    </text>

    <!-- Two Clean Pods -->
    <g transform="translate(0, 74)">
      <rect width="350" height="46" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="20" class="mono" font-size="11" fill="#fb7185" font-weight="600">ARCHITECTURE &amp; NEGATIVE SPACE</text>
      <text x="14" y="36" class="sans" font-size="13" fill="#f1f5f9">Physical scale models studying spatial voids &amp; light</text>

      <g transform="translate(366, 0)">
        <rect width="350" height="46" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="14" y="20" class="mono" font-size="11" fill="#38bdf8" font-weight="600">TRADITIONAL FINE ART &amp; 2D MEDIA</text>
        <text x="14" y="36" class="sans" font-size="13" fill="#f1f5f9">Oil paintings on canvas &amp; analog mark-making</text>
      </g>
    </g>

    <!-- Stack Chips -->
    <g transform="translate(0, 148)">
      <text class="mono" font-size="11" fill="#64748b">DOMAINS:</text>
      <rect x="70" y="-14" width="160" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="82" y="3" class="mono" font-size="11.5" fill="#cbd5e1">Scale Physical Models</text>

      <rect x="240" y="-14" width="124" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="252" y="3" class="mono" font-size="11.5" fill="#cbd5e1">Oil on Canvas</text>

      <rect x="374" y="-14" width="168" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="386" y="3" class="mono" font-size="11.5" fill="#cbd5e1">Negative Space Studies</text>

      <rect x="552" y="-14" width="164" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="564" y="3" class="mono" font-size="11.5" fill="#fb7185">Urban Spatial Theory</text>
    </g>
  </g>

  <!-- Right Column -->
  <g transform="translate(800, 26)">
    <rect width="364" height="176" rx="10" fill="#070d18" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="28" class="mono" font-size="11" fill="#64748b" letter-spacing="1.5">LIVE DIGITAL PORTFOLIO</text>
    <line x1="22" y1="38" x2="342" y2="38" stroke="#1e293b" stroke-width="1"/>

    <text x="22" y="68" class="sans" font-size="22" font-weight="800" fill="#ffffff">Art &amp; Architecture</text>
    <text x="22" y="90" class="sans" font-size="13.5" fill="#e2e8f0">Physical models, oil paintings,</text>
    <text x="22" y="108" class="sans" font-size="13.5" fill="#94a3b8">and spatial investigations.</text>

    <g transform="translate(22, 124)">
      <rect width="320" height="36" rx="6" fill="#0f172a" stroke="#fb7185" stroke-width="0.8"/>
      <text x="14" y="22" class="mono" font-size="11.5" fill="#fb7185" font-weight="600">PORTFOLIO // art-design-portfolio-orpin</text>
    </g>
  </g>
</svg>
