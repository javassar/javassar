<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <pattern id="cardGrid4" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="240" rx="14" fill="url(#stackBg)"/>
  <rect width="1200" height="240" rx="14" fill="url(#cardGrid4)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Left: Domain Capacity Distribution -->
  <g transform="translate(36, 30)">
    <text class="mono" font-size="11" fill="#38bdf8" letter-spacing="1.5" font-weight="600">CAPABILITIES // MULTIDISCIPLINARY SYNTHESIS</text>
    <text y="28" class="sans" font-size="22" font-weight="800" fill="#ffffff">Interdisciplinary Methodological Stack</text>

    <!-- Bar 1 -->
    <g transform="translate(0, 46)">
      <text class="mono" font-size="11.5" fill="#e2e8f0">COGNITIVE SCIENCE &amp; MACHINE CREATIVITY (AI)</text>
      <text x="500" y="0" text-anchor="end" class="mono" font-size="11.5" fill="#38bdf8" font-weight="600">96%</text>
      <rect y="7" width="500" height="8" rx="4" fill="#1e293b"/>
      <rect y="7" width="480" height="8" rx="4" fill="url(#bar1)"/>
    </g>

    <!-- Bar 2 -->
    <g transform="translate(0, 82)">
      <text class="mono" font-size="11.5" fill="#e2e8f0">DATA ANALYSIS, MODELING &amp; VISUALIZATION</text>
      <text x="500" y="0" text-anchor="end" class="mono" font-size="11.5" fill="#818cf8" font-weight="600">92%</text>
      <rect y="7" width="500" height="8" rx="4" fill="#1e293b"/>
      <rect y="7" width="460" height="8" rx="4" fill="url(#bar2)"/>
    </g>

    <!-- Bar 3 -->
    <g transform="translate(0, 118)">
      <text class="mono" font-size="11.5" fill="#e2e8f0">TACTILE PWAS, AESTHETIC BUILDS &amp; UI/UX</text>
      <text x="500" y="0" text-anchor="end" class="mono" font-size="11.5" fill="#34d399" font-weight="600">88%</text>
      <rect y="7" width="500" height="8" rx="4" fill="#1e293b"/>
      <rect y="7" width="440" height="8" rx="4" fill="url(#bar3)"/>
    </g>

    <!-- Bar 4 -->
    <g transform="translate(0, 154)">
      <text class="mono" font-size="11.5" fill="#e2e8f0">BUILT ENVIRONMENTS, TRADITIONAL &amp; TECH ART</text>
      <text x="500" y="0" text-anchor="end" class="mono" font-size="11.5" fill="#f43f5e" font-weight="600">85%</text>
      <rect y="7" width="500" height="8" rx="4" fill="#1e293b"/>
      <rect y="7" width="425" height="8" rx="4" fill="url(#bar4)"/>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="585" y1="20" x2="585" y2="216" stroke="#1e293b" stroke-width="1"/>

  <!-- Right: Technical Infrastructure Grid (De-cluttered) -->
  <g transform="translate(620, 30)">
    <text class="mono" font-size="11" fill="#818cf8" letter-spacing="1.5" font-weight="600">INFRASTRUCTURE // TECHNOLOGIES</text>
    <text y="28" class="sans" font-size="22" font-weight="800" fill="#ffffff">Applied Tooling Matrix</text>

    <!-- Technology Pods -->
    <g transform="translate(0, 46)">
      <!-- AI & CogSci -->
      <rect width="260" height="60" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="16" y="22" class="mono" font-size="11" fill="#38bdf8" font-weight="600">AI &amp; COGNITION</text>
      <text x="16" y="44" class="sans" font-size="13" fill="#f1f5f9">Multi-Agent Pipelines &amp; jsPsych</text>

      <!-- Stats & Modeling -->
      <g transform="translate(276, 0)">
        <rect width="260" height="60" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="22" class="mono" font-size="11" fill="#818cf8" font-weight="600">DATA &amp; VISUALIZATION</text>
        <text x="16" y="44" class="sans" font-size="13" fill="#f1f5f9">R (Tidyverse), Python &amp; Time Series</text>
      </g>

      <!-- Engineering & PWAs -->
      <g transform="translate(0, 72)">
        <rect width="260" height="60" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="22" class="mono" font-size="11" fill="#34d399" font-weight="600">TACTILE WEB BUILDS</text>
        <text x="16" y="44" class="sans" font-size="13" fill="#f1f5f9">TypeScript, PWA &amp; Phaser.js</text>
      </g>

      <!-- Spatial & Design -->
      <g transform="translate(276, 72)">
        <rect width="260" height="60" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="22" class="mono" font-size="11" fill="#f43f5e" font-weight="600">BUILT FORM &amp; ART</text>
        <text x="16" y="44" class="sans" font-size="13" fill="#f1f5f9">Urban Morphology &amp; Fine Art</text>
      </g>
    </g>
  </g>
</svg>
