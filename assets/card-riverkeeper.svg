<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBgRk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="riverGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="cardGridRk" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="230" rx="14" fill="url(#cardBgRk)"/>
  <rect width="1200" height="230" rx="14" fill="url(#cardGridRk)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="228.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0" y="0" width="4" height="230" rx="2" fill="#34d399"/>

  <g transform="translate(36, 32)">
    <text class="mono" font-size="11" fill="#34d399" letter-spacing="1.5" font-weight="600">PROJECT // 03 · STATISTICAL CONSULTING CAPSTONE</text>
    <text y="32" class="sans" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Riverkeeper Spatio-Temporal Water Quality Modeling</text>
    <text y="58" class="sans" font-size="14" fill="#94a3b8">
      Longitudinal data analysis of 17 years of noisy spatio-temporal environmental monitoring across the Hudson River watershed.
    </text>

    <!-- Architecture Schematic -->
    <g transform="translate(0, 84)">
      <rect width="160" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" class="mono" font-size="11" fill="#34d399">17-YEAR MONITORING</text>
      <line x1="160" y1="17" x2="190" y2="17" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>

      <g transform="translate(190, 0)">
        <rect width="160" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="mono" font-size="11" fill="#38bdf8">R / TIDYVERSE CODE</text>
      </g>
      <line x1="350" y1="17" x2="380" y2="17" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>

      <g transform="translate(380, 0)">
        <rect width="160" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="mono" font-size="11" fill="#818cf8">SPATIAL REGRESSION</text>
      </g>
      <line x1="540" y1="17" x2="570" y2="17" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>

      <g transform="translate(570, 0)">
        <rect width="150" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="mono" font-size="11" fill="#f43f5e">POLICY REPORT</text>
      </g>
    </g>

    <!-- Tech Tag Chips -->
    <g transform="translate(0, 142)">
      <text class="mono" font-size="11" fill="#64748b">STACK:</text>
      <rect x="56" y="-14" width="56" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="70" y="3" class="mono" font-size="11.5" fill="#cbd5e1">R</text>

      <rect x="120" y="-14" width="94" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="134" y="3" class="mono" font-size="11.5" fill="#cbd5e1">Tidyverse</text>

      <rect x="222" y="-14" width="146" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="236" y="3" class="mono" font-size="11.5" fill="#cbd5e1">Time Series Models</text>

      <rect x="376" y="-14" width="136" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="390" y="3" class="mono" font-size="11.5" fill="#34d399">Spatial Statistics</text>
    </g>
  </g>

  <!-- Right Side Outcomes Pod -->
  <g transform="translate(800, 26)">
    <rect width="364" height="176" rx="10" fill="#070d18" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="28" class="mono" font-size="11" fill="#64748b" letter-spacing="1.5">EMPIRICAL OUTCOMES</text>
    <line x1="22" y1="38" x2="342" y2="38" stroke="#1e293b" stroke-width="1"/>

    <text x="22" y="74" class="sans" font-size="24" font-weight="800" fill="#34d399">17 Years</text>
    <text x="150" y="72" class="sans" font-size="13.5" fill="#e2e8f0" font-weight="500">Longitudinal Water Monitoring</text>

    <!-- Sparkline Area -->
    <g transform="translate(22, 100)">
      <path d="M 0 30 Q 50 16, 100 22 T 180 10 T 240 18 T 310 4 L 310 38 L 0 38 Z" fill="url(#riverGrad2)"/>
      <path d="M 0 30 Q 50 16, 100 22 T 180 10 T 240 18 T 310 4" fill="none" stroke="#34d399" stroke-width="2"/>
      <circle cx="310" cy="4" r="3" fill="#34d399"/>
    </g>
    <text x="22" y="156" class="mono" font-size="11.5" fill="#34d399">HUDSON RIVER CONSERVATION</text>
  </g>
</svg>
