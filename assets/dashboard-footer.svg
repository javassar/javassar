<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="100%" height="auto">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <pattern id="footGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
  </style>

  <rect width="1200" height="64" rx="10" fill="url(#footerBg)"/>
  <rect width="1200" height="64" rx="10" fill="url(#footGrid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="62.5" rx="9.25" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Left: System Identity -->
  <g transform="translate(36, 37)" class="mono" font-size="12" fill="#64748b">
    <text>JACQUELINE ADELMANN <tspan fill="#334155">|</tspan> VASSAR COLLEGE HONORS</text>
  </g>

  <!-- Center: Philosophical Tagline -->
  <g transform="translate(600, 37)" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8" letter-spacing="2" font-weight="600">
    <text>CONTINUOUS DISCOVERY &amp; EMPIRICAL RIGOR</text>
  </g>

  <!-- Right: Operational Status -->
  <g transform="translate(1164, 37)" text-anchor="end" class="mono" font-size="12">
    <circle cx="-165" cy="-4" r="4" fill="#10b981"/>
    <text fill="#38bdf8" font-weight="600" letter-spacing="1">SYSTEMS OPERATIONAL</text>
  </g>
</svg>
