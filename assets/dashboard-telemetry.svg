<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a11"/>
      <stop offset="40%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="80%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#070a11" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Frame -->
  <rect width="1200" height="440" rx="16" fill="url(#dashBg)"/>
  <rect width="1200" height="440" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="440" rx="16" fill="url(#topGlow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="15.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top System Bar -->
  <g transform="translate(40, 36)" class="mono" font-size="11.5">
    <rect x="0" y="-14" width="96" height="24" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <circle cx="14" cy="-2" r="4" fill="#10b981"/>
    <text x="26" y="2" font-weight="600" fill="#f1f5f9" letter-spacing="1">SYSTEM</text>

    <text x="116" y="2" fill="#94a3b8">VASSAR COLLEGE HONORS</text>
    <text x="320" y="2" fill="#334155">|</text>
    <text x="340" y="2" fill="#94a3b8">PHOENIX, AZ (OPEN TO RELOCATION)</text>
    
    <text x="1120" y="2" text-anchor="end" fill="#38bdf8" font-weight="600">jhbadelmann@gmail.com</text>
  </g>

  <line x1="40" y1="56" x2="1160" y2="56" stroke="#1e293b" stroke-width="1"/>

  <!-- Identity Console -->
  <g transform="translate(40, 102)">
    <text class="mono" font-size="11.5" fill="#38bdf8" letter-spacing="2" font-weight="600">INTERDISCIPLINARY SYSTEMS &amp; CREATIVE TECHNOLOGY</text>
    <text y="42" class="sans" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">JACQUELINE ADELMANN</text>
    <text y="70" class="sans" font-size="15" font-weight="500" fill="#94a3b8">
      Cognitive Systems <tspan fill="#334155">·</tspan> Machine Creativity &amp; AI <tspan fill="#334155">·</tspan> Built Environments &amp; Spatial Design <tspan fill="#334155">·</tspan> Data Analytics
    </text>
  </g>

  <!-- 4 Primary KPI Tiles (Cleaned & De-cluttered) -->
  <g transform="translate(40, 208)">
    <!-- Tile 1: 7-Stage LLM Pipeline -->
    <g transform="translate(0, 0)">
      <rect width="265" height="195" rx="12" fill="url(#tileBg)" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="3" rx="1.5" fill="#38bdf8"/>
      
      <text x="20" y="28" class="mono" font-size="11" fill="#38bdf8" letter-spacing="1.5" font-weight="600">SYS // 01</text>
      <text x="245" y="28" text-anchor="end" class="mono" font-size="11" fill="#64748b">AI CREATIVITY</text>
      
      <text x="20" y="68" class="sans" font-size="32" font-weight="800" fill="#ffffff">7-Stage</text>
      <text x="20" y="90" class="sans" font-size="13" fill="#94a3b8">Autonomous Prompt Pipeline</text>

      <!-- 7 Pipeline Segments -->
      <g transform="translate(20, 114)">
        <rect x="0" y="0" width="27" height="7" rx="2" fill="#38bdf8"/>
        <rect x="33" y="0" width="27" height="7" rx="2" fill="#38bdf8"/>
        <rect x="66" y="0" width="27" height="7" rx="2" fill="#38bdf8"/>
        <rect x="99" y="0" width="27" height="7" rx="2" fill="#38bdf8"/>
        <rect x="132" y="0" width="27" height="7" rx="2" fill="#38bdf8"/>
        <rect x="165" y="0" width="27" height="7" rx="2" fill="#38bdf8"/>
        <rect x="198" y="0" width="27" height="7" rx="2" fill="#38bdf8"/>
      </g>

      <!-- Chip -->
      <g transform="translate(20, 145)">
        <rect width="195" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="18" class="mono" font-size="11.5" fill="#38bdf8">18 Phaser.js Games</text>
      </g>
    </g>

    <!-- Tile 2: Empirical Cohorts -->
    <g transform="translate(285, 0)">
      <rect width="265" height="195" rx="12" fill="url(#tileBg)" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="3" rx="1.5" fill="#818cf8"/>

      <text x="20" y="28" class="mono" font-size="11" fill="#818cf8" letter-spacing="1.5" font-weight="600">SYS // 02</text>
      <text x="245" y="28" text-anchor="end" class="mono" font-size="11" fill="#64748b">BEHAVIOR</text>

      <text x="20" y="68" class="sans" font-size="30" font-weight="800" fill="#ffffff">N=81 &amp; 550+</text>
      <text x="20" y="90" class="sans" font-size="13" fill="#94a3b8">Human-in-the-Loop &amp; Survey</text>

      <!-- Progress Gauge Bar -->
      <g transform="translate(20, 114)">
        <rect width="225" height="8" rx="4" fill="#1e293b"/>
        <rect width="190" height="8" rx="4" fill="url(#gaugeGrad)"/>
      </g>

      <!-- Chip -->
      <g transform="translate(20, 145)">
        <rect width="195" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="18" class="mono" font-size="11.5" fill="#818cf8">Consensual Assessment</text>
      </g>
    </g>

    <!-- Tile 3: 17-Year Longitudinal Data -->
    <g transform="translate(570, 0)">
      <rect width="265" height="195" rx="12" fill="url(#tileBg)" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="3" rx="1.5" fill="#34d399"/>

      <text x="20" y="28" class="mono" font-size="11" fill="#34d399" letter-spacing="1.5" font-weight="600">SYS // 03</text>
      <text x="245" y="28" text-anchor="end" class="mono" font-size="11" fill="#64748b">DATA</text>

      <text x="20" y="68" class="sans" font-size="32" font-weight="800" fill="#ffffff">17 Years</text>
      <text x="20" y="90" class="sans" font-size="13" fill="#94a3b8">Hudson River Water Data</text>

      <!-- Sparkline Chart -->
      <g transform="translate(20, 106)">
        <path d="M 0 24 Q 30 14, 60 18 T 120 10 T 170 16 T 225 4 L 225 28 L 0 28 Z" fill="url(#sparkGrad)"/>
        <path d="M 0 24 Q 30 14, 60 18 T 120 10 T 170 16 T 225 4" fill="none" stroke="#34d399" stroke-width="2"/>
        <circle cx="225" cy="4" r="3" fill="#34d399"/>
      </g>

      <!-- Chip -->
      <g transform="translate(20, 145)">
        <rect width="195" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="18" class="mono" font-size="11.5" fill="#34d399">Riverkeeper Modeling</text>
      </g>
    </g>

    <!-- Tile 4: Spatial Systems & Portfolio -->
    <g transform="translate(855, 0)">
      <rect width="265" height="195" rx="12" fill="url(#tileBg)" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="3" rx="1.5" fill="#f43f5e"/>

      <text x="20" y="28" class="mono" font-size="11" fill="#f43f5e" letter-spacing="1.5" font-weight="600">SYS // 04</text>
      <text x="245" y="28" text-anchor="end" class="mono" font-size="11" fill="#64748b">SPATIAL &amp; ART</text>

      <text x="20" y="68" class="sans" font-size="32" font-weight="800" fill="#ffffff">Portfolio</text>
      <text x="20" y="90" class="sans" font-size="13" fill="#94a3b8">Built Space &amp; Fine Art</text>

      <!-- Status Pod -->
      <g transform="translate(20, 110)">
        <circle cx="6" cy="6" r="4" fill="#f43f5e"/>
        <text x="18" y="10" class="mono" font-size="11.5" fill="#cbd5e1">PHYSICAL MODELS &amp; ART</text>
      </g>

      <!-- Chip -->
      <g transform="translate(20, 145)">
        <rect width="220" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="18" class="mono" font-size="11" fill="#f43f5e">art-design-portfolio-orpin</text>
      </g>
    </g>
  </g>
</svg>
