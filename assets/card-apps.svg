<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBgApps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <pattern id="cardGridApps" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="240" rx="14" fill="url(#cardBgApps)"/>
  <rect width="1200" height="240" rx="14" fill="url(#cardGridApps)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0" y="0" width="4" height="240" rx="2" fill="#f43f5e"/>

  <!-- Left Pane: Little Hours -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="3" height="176" rx="1.5" fill="#f43f5e"/>
    <g transform="translate(16, 0)">
      <text class="mono" font-size="10" fill="#f43f5e" letter-spacing="2" font-weight="600">APP // 01 · AMBIENT MICRO-TRACKING PWA</text>
      <text y="28" class="sans" font-size="22" font-weight="800" fill="#ffffff">Little Hours</text>
      <text y="50" class="sans" font-size="12.5" fill="#94a3b8">
        Explores digital friction, analog cadence, and mindful habit tracking.
      </text>

      <g transform="translate(0, 74)">
        <rect width="250" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <circle cx="16" cy="21" r="4" fill="#f43f5e"/>
        <text x="28" y="18" class="sans" font-size="12" font-weight="700" fill="#ffffff">TypeScript Architecture</text>
        <text x="28" y="32" class="mono" font-size="9.5" fill="#64748b">OFFLINE CACHING · SERVICE WORKERS</text>
      </g>

      <g transform="translate(0, 142)">
        <rect width="116" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="10" y="14" class="mono" font-size="10" fill="#f43f5e">TypeScript PWA</text>

        <rect x="126" y="0" width="120" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="136" y="14" class="mono" font-size="10" fill="#cbd5e1">Tactile UI Design</text>

        <rect x="256" y="0" width="130" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="266" y="14" class="mono" font-size="10" fill="#cbd5e1">User Beta Testing</text>
      </g>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="585" y1="24" x2="585" y2="216" stroke="#1e293b" stroke-width="1"/>

  <!-- Right Pane: Group Fitness App -->
  <g transform="translate(620, 32)">
    <rect x="0" y="0" width="3" height="176" rx="1.5" fill="#38bdf8"/>
    <g transform="translate(16, 0)">
      <text class="mono" font-size="10" fill="#38bdf8" letter-spacing="2" font-weight="600">APP // 02 · SOCIAL MOVEMENT &amp; WORKOUT SCHEDULING</text>
      <text y="28" class="sans" font-size="22" font-weight="800" fill="#ffffff">Group Fitness App</text>
      <text y="50" class="sans" font-size="12.5" fill="#94a3b8">
        Coordinates shared fitness routines around movement motivation and utility.
      </text>

      <g transform="translate(0, 74)">
        <rect width="250" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <circle cx="16" cy="21" r="4" fill="#38bdf8"/>
        <text x="28" y="18" class="sans" font-size="12" font-weight="700" fill="#ffffff">Mobile-First Utility</text>
        <text x="28" y="32" class="mono" font-size="9.5" fill="#64748b">SOCIAL ACCOUNTABILITY · ERGONOMICS</text>
      </g>

      <g transform="translate(0, 142)">
        <rect width="100" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="10" y="14" class="mono" font-size="10" fill="#38bdf8">Mobile Web</text>

        <rect x="110" y="0" width="140" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="120" y="14" class="mono" font-size="10" fill="#cbd5e1">Interactive Scheduling</text>

        <rect x="260" y="0" width="130" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="270" y="14" class="mono" font-size="10" fill="#cbd5e1">Responsive Layout</text>
      </g>
    </g>
  </g>
</svg>
