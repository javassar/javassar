<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBgApps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="appsBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="cardGridApps" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="240" rx="14" fill="url(#cardBgApps)"/>
  <rect width="1200" height="240" rx="14" fill="url(#cardGridApps)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0" y="0" width="4" height="240" rx="2" fill="url(#appsBorderGrad)"/>

  <!-- Left Column: Ember -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="3" height="184" rx="1.5" fill="#f97316"/>
    <g transform="translate(16, 0)">
      <text class="mono" font-size="10.5" fill="#f97316" letter-spacing="1.2" font-weight="600">APP // 01 · DELIBERATE CONTENT PWA</text>
      <text y="28" class="sans" font-size="22" font-weight="800" fill="#ffffff">Ember</text>
      <text y="50" class="sans" font-size="12.5" fill="#94a3b8">Private, local-first space turning personal quotes</text>
      <text y="68" class="sans" font-size="12.5" fill="#94a3b8">&amp; media into finite daily focus rituals.</text>

      <g transform="translate(0, 86)">
        <rect width="320" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <circle cx="16" cy="18" r="4" fill="#f97316"/>
        <text x="28" y="22" class="sans" font-size="12" font-weight="600" fill="#f1f5f9">Zero-Network / IndexedDB PWA</text>
      </g>

      <g transform="translate(0, 136)">
        <rect width="100" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="16" class="mono" font-size="11" fill="#f97316">Local-First</text>

        <rect x="108" y="0" width="96" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="118" y="16" class="mono" font-size="11" fill="#cbd5e1">WebCrypto</text>

        <rect x="212" y="0" width="108" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="222" y="16" class="mono" font-size="11" fill="#cbd5e1">Zero-Network</text>
      </g>
    </g>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="404" y1="20" x2="404" y2="220" stroke="#1e293b" stroke-width="1"/>

  <!-- Middle Column: Little Hours -->
  <g transform="translate(432, 28)">
    <rect x="0" y="0" width="3" height="184" rx="1.5" fill="#f43f5e"/>
    <g transform="translate(16, 0)">
      <text class="mono" font-size="10.5" fill="#f43f5e" letter-spacing="1.2" font-weight="600">APP // 02 · AMBIENT MICRO-TRACKING</text>
      <text y="28" class="sans" font-size="22" font-weight="800" fill="#ffffff">Little Hours</text>
      <text y="50" class="sans" font-size="12.5" fill="#94a3b8">Explores digital friction, analog cadence, and</text>
      <text y="68" class="sans" font-size="12.5" fill="#94a3b8">mindful habit tracking via low-noise UI.</text>

      <g transform="translate(0, 86)">
        <rect width="320" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <circle cx="16" cy="18" r="4" fill="#f43f5e"/>
        <text x="28" y="22" class="sans" font-size="12" font-weight="600" fill="#f1f5f9">TypeScript Architecture</text>
      </g>

      <g transform="translate(0, 136)">
        <rect width="118" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="16" class="mono" font-size="11" fill="#f43f5e">TypeScript PWA</text>

        <rect x="126" y="0" width="96" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="136" y="16" class="mono" font-size="11" fill="#cbd5e1">Tactile UI</text>

        <rect x="230" y="0" width="90" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="240" y="16" class="mono" font-size="11" fill="#cbd5e1">Habit Flow</text>
      </g>
    </g>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="796" y1="20" x2="796" y2="220" stroke="#1e293b" stroke-width="1"/>

  <!-- Right Column: Group Fitness App -->
  <g transform="translate(824, 28)">
    <rect x="0" y="0" width="3" height="184" rx="1.5" fill="#38bdf8"/>
    <g transform="translate(16, 0)">
      <text class="mono" font-size="10.5" fill="#38bdf8" letter-spacing="1.2" font-weight="600">APP // 03 · SOCIAL MOVEMENT &amp; UTILITY</text>
      <text y="28" class="sans" font-size="22" font-weight="800" fill="#ffffff">Group Fitness App</text>
      <text y="50" class="sans" font-size="12.5" fill="#94a3b8">Coordinates shared fitness routines around</text>
      <text y="68" class="sans" font-size="12.5" fill="#94a3b8">movement motivation, schedules &amp; utility.</text>

      <g transform="translate(0, 86)">
        <rect width="320" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <circle cx="16" cy="18" r="4" fill="#38bdf8"/>
        <text x="28" y="22" class="sans" font-size="12" font-weight="600" fill="#f1f5f9">Mobile-First Interface Utility</text>
      </g>

      <g transform="translate(0, 136)">
        <rect width="100" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="16" class="mono" font-size="11" fill="#38bdf8">Mobile Web</text>

        <rect x="108" y="0" width="108" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="118" y="16" class="mono" font-size="11" fill="#cbd5e1">Scheduling</text>

        <rect x="224" y="0" width="96" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="234" y="16" class="mono" font-size="11" fill="#cbd5e1">Ergonomics</text>
      </g>
    </g>
  </g>
</svg>
