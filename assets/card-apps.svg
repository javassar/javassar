<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBgApps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <pattern id="cardGridApps" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="230" rx="14" fill="url(#cardBgApps)"/>
  <rect width="1200" height="230" rx="14" fill="url(#cardGridApps)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="228.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0" y="0" width="4" height="230" rx="2" fill="#f43f5e"/>

  <!-- Left Pane: Little Hours -->
  <g transform="translate(36, 30)">
    <rect x="0" y="0" width="3" height="170" rx="1.5" fill="#f43f5e"/>
    <g transform="translate(18, 0)">
      <text class="mono" font-size="11" fill="#f43f5e" letter-spacing="1.5" font-weight="600">APP // 01 · AMBIENT MICRO-TRACKING PWA</text>
      <text y="28" class="sans" font-size="24" font-weight="800" fill="#ffffff">Little Hours</text>
      <text y="50" class="sans" font-size="13.5" fill="#94a3b8">
        Explores digital friction, analog cadence, and mindful habit tracking.
      </text>

      <g transform="translate(0, 68)">
        <rect width="250" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <circle cx="16" cy="19" r="4" fill="#f43f5e"/>
        <text x="28" y="23" class="sans" font-size="13" font-weight="600" fill="#f1f5f9">TypeScript Architecture</text>
      </g>

      <g transform="translate(0, 134)">
        <rect width="126" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="16" class="mono" font-size="11.5" fill="#f43f5e">TypeScript PWA</text>

        <rect x="136" y="0" width="130" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="148" y="16" class="mono" font-size="11.5" fill="#cbd5e1">Tactile UI Design</text>

        <rect x="276" y="0" width="136" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="288" y="16" class="mono" font-size="11.5" fill="#cbd5e1">User Beta Testing</text>
      </g>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="585" y1="20" x2="585" y2="210" stroke="#1e293b" stroke-width="1"/>

  <!-- Right Pane: Group Fitness App -->
  <g transform="translate(620, 30)">
    <rect x="0" y="0" width="3" height="170" rx="1.5" fill="#38bdf8"/>
    <g transform="translate(18, 0)">
      <text class="mono" font-size="11" fill="#38bdf8" letter-spacing="1.5" font-weight="600">APP // 02 · SOCIAL MOVEMENT &amp; SCHEDULING</text>
      <text y="28" class="sans" font-size="24" font-weight="800" fill="#ffffff">Group Fitness App</text>
      <text y="50" class="sans" font-size="13.5" fill="#94a3b8">
        Coordinates shared fitness routines around movement motivation and utility.
      </text>

      <g transform="translate(0, 68)">
        <rect width="250" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <circle cx="16" cy="19" r="4" fill="#38bdf8"/>
        <text x="28" y="23" class="sans" font-size="13" font-weight="600" fill="#f1f5f9">Mobile-First Interface Utility</text>
      </g>

      <g transform="translate(0, 134)">
        <rect width="116" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="16" class="mono" font-size="11.5" fill="#38bdf8">Mobile Web</text>

        <rect x="126" y="0" width="154" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="138" y="16" class="mono" font-size="11.5" fill="#cbd5e1">Interactive Scheduling</text>

        <rect x="290" y="0" width="136" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="302" y="16" class="mono" font-size="11.5" fill="#cbd5e1">Ergonomic Layout</text>
      </g>
    </g>
  </g>
</svg>
