<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <pattern id="cardGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="230" rx="14" fill="url(#cardBg)"/>
  <rect width="1200" height="230" rx="14" fill="url(#cardGrid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="228.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0" y="0" width="4" height="230" rx="2" fill="#38bdf8"/>

  <!-- Left Header Column -->
  <g transform="translate(36, 32)">
    <text class="mono" font-size="11" fill="#38bdf8" letter-spacing="1.5" font-weight="600">PROJECT // 01 · SENIOR THESIS IN COGNITIVE SCIENCE</text>
    <text y="32" class="sans" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Are Large Language Models Creative?</text>
    <text y="58" class="sans" font-size="14" fill="#94a3b8">
      Investigating conceptual and empirical boundaries of machine creativity through autonomous prompt architecture.
    </text>

    <!-- Pipeline Schematic -->
    <g transform="translate(0, 84)">
      <rect width="136" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" class="mono" font-size="11" fill="#38bdf8">01 PROMPT SPEC</text>
      <line x1="136" y1="17" x2="166" y2="17" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>

      <g transform="translate(166, 0)">
        <rect width="160" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="mono" font-size="11" fill="#818cf8">02 7-STAGE PIPELINE</text>
      </g>
      <line x1="326" y1="17" x2="356" y2="17" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>

      <g transform="translate(356, 0)">
        <rect width="156" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="mono" font-size="11" fill="#34d399">03 PHASER 2D BUILD</text>
      </g>
      <line x1="512" y1="17" x2="542" y2="17" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>

      <g transform="translate(542, 0)">
        <rect width="150" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" class="mono" font-size="11" fill="#f43f5e">04 CAT EVALUATION</text>
      </g>
    </g>

    <!-- Tech Tag Chips (Legible 11.5px) -->
    <g transform="translate(0, 142)">
      <text class="mono" font-size="11" fill="#64748b">STACK:</text>
      <rect x="56" y="-14" width="100" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="68" y="3" class="mono" font-size="11.5" fill="#cbd5e1">JavaScript</text>

      <rect x="164" y="-14" width="94" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="178" y="3" class="mono" font-size="11.5" fill="#cbd5e1">Phaser.js</text>

      <rect x="266" y="-14" width="154" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="280" y="3" class="mono" font-size="11.5" fill="#cbd5e1">Claude, GPT &amp; Gemini</text>

      <rect x="428" y="-14" width="168" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="442" y="3" class="mono" font-size="11.5" fill="#38bdf8">Consensual Assessment</text>
    </g>
  </g>

  <!-- Right Side Outcomes Pod (Clear & Uncluttered) -->
  <g transform="translate(800, 26)">
    <rect width="364" height="176" rx="10" fill="#070d18" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="28" class="mono" font-size="11" fill="#64748b" letter-spacing="1.5">EMPIRICAL OUTCOMES</text>
    <line x1="22" y1="38" x2="342" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Outcome 1 -->
    <text x="22" y="74" class="sans" font-size="24" font-weight="800" fill="#38bdf8">18 Games</text>
    <text x="150" y="72" class="sans" font-size="13.5" fill="#e2e8f0" font-weight="500">Playable 2D Phaser Games</text>

    <!-- Outcome 2 -->
    <text x="22" y="118" class="sans" font-size="24" font-weight="800" fill="#818cf8">N = 81</text>
    <text x="150" y="116" class="sans" font-size="13.5" fill="#e2e8f0" font-weight="500">Human Behavioral Evaluators</text>

    <!-- Outcome 3 -->
    <text x="22" y="156" class="sans" font-size="20" font-weight="800" fill="#34d399">3 Models</text>
    <text x="150" y="154" class="sans" font-size="13.5" fill="#e2e8f0" font-weight="500">Multi-Model Orchestration</text>
  </g>
</svg>
