<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="cardGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Frame -->
  <rect width="1200" height="240" rx="14" fill="url(#cardBg)"/>
  <rect width="1200" height="240" rx="14" fill="url(#cardGrid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0" y="0" width="4" height="240" rx="2" fill="#38bdf8"/>

  <!-- Left Header Column -->
  <g transform="translate(36, 36)">
    <text class="mono" font-size="10" fill="#38bdf8" letter-spacing="2" font-weight="600">PROJECT // 01 · SENIOR THESIS IN COGNITIVE SCIENCE</text>
    <text y="32" class="sans" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Are Large Language Models Creative?</text>
    <text y="58" class="sans" font-size="13.5" fill="#94a3b8">
      Investigating conceptual and empirical boundaries of machine creativity through autonomous prompt architecture.
    </text>

    <!-- Pipeline Schematic -->
    <g transform="translate(0, 88)">
      <!-- Step 1 -->
      <rect width="130" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="21" class="mono" font-size="10.5" fill="#38bdf8">01 PROMPT SPEC</text>
      <line x1="130" y1="17" x2="160" y2="17" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Step 2 -->
      <g transform="translate(160, 0)">
        <rect width="160" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="21" class="mono" font-size="10.5" fill="#818cf8">02 7-STAGE PIPELINE</text>
      </g>
      <line x1="320" y1="17" x2="350" y2="17" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Step 3 -->
      <g transform="translate(350, 0)">
        <rect width="150" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="21" class="mono" font-size="10.5" fill="#34d399">03 PHASER 2D BUILD</text>
      </g>
      <line x1="500" y1="17" x2="530" y2="17" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Step 4 -->
      <g transform="translate(530, 0)">
        <rect width="140" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="21" class="mono" font-size="10.5" fill="#f43f5e">04 CAT EVALUATION</text>
      </g>
    </g>

    <!-- Tech Tag Chips -->
    <g transform="translate(0, 142)">
      <text class="mono" font-size="10" fill="#64748b">STACK:</text>
      <rect x="52" y="-12" width="70" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="64" y="2" class="mono" font-size="10" fill="#cbd5e1">Python</text>

      <rect x="130" y="-12" width="86" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="142" y="2" class="mono" font-size="10" fill="#cbd5e1">Phaser.js</text>

      <rect x="224" y="-12" width="94" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="236" y="2" class="mono" font-size="10" fill="#cbd5e1">Claude API</text>

      <rect x="326" y="-12" width="76" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="338" y="2" class="mono" font-size="10" fill="#cbd5e1">Gemini</text>

      <rect x="410" y="-12" width="84" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="422" y="2" class="mono" font-size="10" fill="#cbd5e1">ChatGPT</text>

      <rect x="502" y="-12" width="130" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="514" y="2" class="mono" font-size="10" fill="#38bdf8">Consensual Assessment</text>
    </g>
  </g>

  <!-- Right Side Telemetry KPI Pod -->
  <g transform="translate(820, 30)">
    <rect width="344" height="180" rx="10" fill="#070d18" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" class="mono" font-size="10" fill="#64748b" letter-spacing="1.5">EMPIRICAL OUTCOMES</text>
    <line x1="20" y1="38" x2="324" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Outcome 1 -->
    <text x="20" y="68" class="sans" font-size="24" font-weight="800" fill="#38bdf8">18 Games</text>
    <text x="150" y="66" class="sans" font-size="12" fill="#94a3b8">Playable 2D Phaser Games</text>
    <text x="150" y="80" class="mono" font-size="9.5" fill="#64748b">Generated From Scratch</text>

    <!-- Outcome 2 -->
    <text x="20" y="118" class="sans" font-size="24" font-weight="800" fill="#818cf8">N = 81</text>
    <text x="150" y="116" class="sans" font-size="12" fill="#94a3b8">Behavioral Evaluators</text>
    <text x="150" y="130" class="mono" font-size="9.5" fill="#64748b">Consensual Assessment Technique</text>

    <!-- Outcome 3 -->
    <text x="20" y="162" class="sans" font-size="20" font-weight="800" fill="#34d399">3 Models</text>
    <text x="150" y="160" class="sans" font-size="12" fill="#94a3b8">Claude, GPT &amp; Gemini</text>
  </g>
</svg>
